<style>
:root{--card:#fff;--navy:#0A1F44;--navy2:#13306b;--yellow:#FFC107;--ink:#000;--bg:#F2F4F8;--line:#e0e5ee;--mut:#5d6b87}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}h1,h2,h3{margin:0}.hide{display:none!important}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--navy2)}.btn.y{background:var(--yellow);color:#000}.btn.y:hover{background:#e6ac00}
.btn.o{background:var(--card);color:var(--navy);border:1.5px solid var(--navy)}.btn.k{background:#000}.btn.sm{padding:6px 11px;font-size:12px}.btn:disabled{opacity:.5;cursor:wait}
label{display:block;font-weight:600;font-size:12px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--yellow);outline-offset:1px;border-color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
/* login */

.lcard{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1.1fr;gap:18px;padding:18px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,236,160,.55));box-shadow:0 30px 70px rgba(10,31,68,.18)}
.lform{padding:22px 34px;display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
.lbrand{align-self:flex-start;border:1.5px solid var(--navy);border-radius:30px;padding:7px 18px;font-weight:800;color:var(--navy)}
.lform form{width:100%;max-width:340px;margin:auto}.lform h1{font-size:28px;font-weight:800;text-align:center}.lform p{text-align:center;color:var(--mut);margin:8px 0 22px}

.lform .btn{width:100%;border-radius:30px;padding:14px;margin-top:22px}.lfoot{text-align:center;color:var(--mut);font-size:11px}
.lphoto{border-radius:22px;min-height:520px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(10,31,68,.15),rgba(10,31,68,.55)),url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=900&q=65') center/cover}
.fl{position:absolute;border-radius:16px;padding:12px 14px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.f1{top:22px;left:22px;background:var(--yellow);font-weight:700;max-width:230px}.f1 small{display:block;font-weight:500;margin-top:3px}
.f2{bottom:24px;left:22px;background:#fff;font-weight:700;display:flex;gap:10px;align-items:center}.f2 i{color:var(--navy);font-size:22px}.f2 small{display:block;color:var(--mut);font-weight:500}
.f3{top:46%;right:22px;background:rgba(255,255,255,.92);display:flex;gap:6px;text-align:center;font-weight:700}.f3 span{padding:6px 8px;border-radius:10px}.f3 small{display:block;font-weight:500;color:var(--mut);font-size:10px}.f3 .on{background:var(--navy);color:#fff}.f3 .on small{color:#cdd7ee}
/* app */

.sidebar.open li .tooltip{display:none}

.sidebar li.sec{height:1px;margin:14px 6px;background:rgba(255,255,255,.14)}

.sidebar.open li.sec{height:auto;background:none;margin:16px 6px 4px}.sidebar.open li.sec span{display:block}
.profile{position:absolute;left:0;bottom:0;width:100%;height:70px;padding:12px 14px;background:#08183a;display:flex;align-items:center;gap:10px;overflow:hidden}
.profile .av{border-radius:10px;width:46px;height:46px;flex-shrink:0}
.profile .u{flex:1;min-width:0;white-space:nowrap;opacity:0;transition:all .4s ease}.sidebar.open .profile .u{opacity:1}
.profile .u b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}.profile .u small{color:var(--yellow);font-size:12px;font-weight:600}
.lo{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;border-radius:10px;padding:8px;opacity:0;pointer-events:none;transition:all .4s ease}
.sidebar.open .lo{opacity:1;pointer-events:auto}.lo:hover{background:rgba(255,255,255,.12)}
.av{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:#000;font-weight:800;display:grid;place-items:center;object-fit:cover;flex-shrink:0}

.g{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ch h3{font-size:15px}

.dtb{width:52px;height:56px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-content:center;text-align:center;flex-shrink:0}.dtb b{font-size:20px;line-height:1}.dtb small{font-size:10px;color:var(--yellow);font-weight:700}
.mi2{flex:1;min-width:0}.mi2 b{display:block}.mi2 small{color:var(--mut)}
.f3 span{cursor:pointer}.f3 .has:after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--yellow);margin:3px auto 0}
dialog.wide{width:min(1100px,96vw)}.viewer{width:100%;height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.vload{position:relative}.vload:before{content:'Cargando documento…';position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);z-index:0}.vload iframe{position:relative;z-index:1}
@media(max-width:700px){.viewer{height:65vh}.meta,.frm,.chk,.row2{grid-template-columns:1fr}}
@media(max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c8{grid-column:span 12}}
@media(max-width:860px){.lcard{grid-template-columns:1fr}.lphoto{display:none}.lform{min-height:0;gap:24px}
.sidebar{transform:translateX(-100%);padding:6px 14px}.sidebar.open{transform:none;width:250px}.shell,.sidebar.open ~ .shell{margin-left:0}main{padding:18px 14px 24px}.sidebar li .tooltip{display:none}.ovl.on{display:block}.hb{display:grid}.topbar{padding:0 12px}.grid2{grid-template-columns:1fr}.c3,.c4,.c6{grid-column:span 12}.hero{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
 
<section id="login"><div class="lcard">
  <div class="lform"><span class="lbrand">POVOA OS</span>
    <form id="fLogin"><h1>Bienvenido de nuevo</h1><p>Ingresa para gestionar las solicitudes de Marketing</p>
      <input type="email" id="lEmail" placeholder="Correo corporativo" aria-label="Correo" required style="margin-bottom:12px">
      <input type="password" id="lPass" placeholder="Contraseña" aria-label="Contraseña" required>
      <button class="btn y" id="bLogin">Ingresar</button></form>
    <small class="lfoot">&copy; 2026 POVOA Marketing System</small></div>
  <div class="lphoto">
    <div class="fl f1" id="lmeet"></div>
    <div class="fl f3" id="lcal"></div>
    <div class="fl f2"><i class="bi bi-patch-check-fill"></i><div>Entrega aprobada<small>Plan de captación enviado al solicitante</small></div></div>
  </div></div></section>
 
<div id="app" class="hide">
  <aside class="sidebar" id="sidebar"><div class="logo-details"><span class="logo-ic">P</span><div class="logo_name">POVOA OS</div><i class="bi bi-list" id="btn" onclick="toggleSide()" role="button" aria-label="Abrir o cerrar menú"></i></div><ul class="nav-list" id="nav"></ul><div class="profile" id="sUser"></div></aside>
  <div class="ovl" id="ovl" onclick="toggleSide(false)"></div>
  <div class="shell">
    <header class="topbar">
      <button class="ib hb" onclick="toggleSide()" aria-label="Menú"><i class="bi bi-list"></i></button>
      <div class="sbox"><i class="bi bi-search"></i><input id="hs" placeholder="Buscar tareas o áreas… (Enter)" aria-label="Buscar" onkeydown="if(event.key==='Enter')gSearch(this.value)"></div>
      <div class="sp"></div>
      <button class="ib" id="thm" onclick="toggleTheme()" aria-label="Cambiar tema"></button>
      <div class="dd" id="ddN"><button class="ib" onclick="dd('ddN',event)" aria-label="Notificaciones"><i class="bi bi-bell"></i><span class="dot hide" id="nBadge"></span></button><div class="pn" id="nPanel"></div></div>
      <button class="ib" onclick="help()" aria-label="Ayuda"><i class="bi bi-question-circle"></i></button>
      <div class="dd" id="ddU"><button class="avb" id="hAv" onclick="dd('ddU',event)" aria-label="Cuenta"></button><div class="pn sm" id="uPanel"></div></div>
    </header>
    <main id="main"></main>
    <footer class="foot">POVOA OS v1.0.0 - Sistema de Gestión de Marketing © 2026</footer>
  </div>
</div>
 
<dialog id="dlg"></dialog>
<div id="toast" class="hide"></div>
 
<script>
const API = "https://script.google.com/macros/s/AKfycbw1LE_PWve-d5c8SY4LJQDS3RkkoSTuAs2qRtS4JTYIDuN9efiCgf3SHD5E32AYIJLf/exec";
const ESTADOS = ['Pendiente','En Progreso','En Revisión','Rechazada','Aprobada'];
const DEPTOS = ['Marketing','Administración','Psicología','Videoanálisis','Coordinación Deportiva','Área Deportiva'];
let S = {user:null,tareas:[],usuarios:[]}, cred = null, view = 'inicio', cal = null;
 
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const role = () => /director|admin/i.test(S.user.Rol) ? 'admin' : /ejecutivo/i.test(S.user.Rol) ? 'eje' : 'sol';
const nameOf = em => { const u = S.usuarios.find(x => String(x.Email).toLowerCase() === String(em).toLowerCase()); return u ? u.Nombres + ' ' + u.Apellidos : (em || 'Sin asignar'); };
const fmt = d => d ? String(d).slice(0,10) : '—';
const today = () => new Date().toLocaleDateString('en-CA');
const late = t => t.Estado !== 'Aprobada' && t.FechaEntrega && fmt(t.FechaEntrega) < today();
function photo(u){ const m = String(u.Fotografia||'').match(/[-\w]{25,}/); const url = !u.Fotografia ? '' : /drive\.google/.test(u.Fotografia) && m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w200` : u.Fotografia;
  return url ? `<img class="av" src="${esc(url)}" alt="" onerror="this.outerHTML='<div class=av>${esc((u.Nombres||'?')[0])}</div>'">` : `<div class="av">${esc((u.Nombres||'?')[0])}</div>`; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hide'),3200); }
 
async function api(action, d = {}) {
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, ...cred, d})});
  const j = await r.json();
  if (j.status !== 'success') throw new Error(j.message || 'Error de conexión');
  if (j.tareas) { S = {user:j.user, tareas:j.tareas, usuarios:j.usuarios, reuniones:j.reuniones||[]}; cacheAgenda(); renderNotifs(); try { sessionStorage.setItem('povoa-data', JSON.stringify(S)); } catch(e) {} }
  return j;
}
async function run(btn, fn, ok) {
  if (btn) btn.disabled = true;
  try { await fn(); if (ok) toast(ok); } catch (e) { toast('⚠ ' + e.message); } finally { if (btn) btn.disabled = false; }
}
async function refresh() { await api('getData'); }
 
/* ---------- sesión ---------- */
$('#fLogin').onsubmit = e => { e.preventDefault();
  cred = {email:$('#lEmail').value.trim(), password:$('#lPass').value};
  run($('#bLogin'), async () => { await refresh(); sessionStorage.setItem('povoa', JSON.stringify(cred)); start(); });
};
function logout(){ sessionStorage.removeItem('povoa'); sessionStorage.removeItem('povoa-data'); location.reload(); }
function start(){
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#sUser').innerHTML = photo(S.user) + `<div class="u"><b>${esc(S.user.Nombres)} ${esc(S.user.Apellidos)}</b><small>${esc(S.user.Rol)}</small></div><button class="lo" onclick="logout()" title="Cerrar sesión" aria-label="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>`;
  const r = role(), rev = S.tareas.filter(t => t.Estado === 'En Revisión').length;
  const N = [['Principal'],['inicio','bi-grid-1x2-fill','Dashboard'],['tablero','bi-kanban-fill',{admin:'Tablero',eje:'Mis tareas',sol:'Mis solicitudes'}[r], r==='admin'?rev:0],['calendario','bi-calendar3','Calendario'],['reuniones','bi-camera-video-fill','Reuniones'],['entregas','bi-folder-check','Entregas'],
    ['Gestión'],['nueva','bi-plus-circle-fill','Nueva solicitud'],['equipo','bi-people-fill','Equipo'],['usuarios','bi-person-lines-fill','Usuarios'],['Cuenta'],['perfil','bi-person-gear','Mi perfil']]
    .filter(x => x.length===1 || !((x[0]==='nueva'&&r==='eje') || (['equipo','usuarios'].includes(x[0])&&r!=='admin') || (['calendario','reuniones'].includes(x[0])&&r==='sol')))
    .filter((x,i,a) => x.length>1 || (a[i+1] && a[i+1].length>1));
  $('#nav').innerHTML = N.map(x => x.length===1 ? `<li class="sec"><span>${x[0]}</span></li>` : `<li><a data-v="${x[0]}" onclick="go('${x[0]}')"><i class="bi ${x[1]}"></i><span class="links_name">${x[2]}</span>${x[3]?`<em>${x[3]}</em>`:''}</a><span class="tooltip">${x[2]}</span></li>`).join('');
  chrome(); go(r==='sol' ? 'nueva' : 'inicio');
}
function go(v){ view = v; if (innerWidth<=860) toggleSide(false); CH.splice(0).forEach(c => c.destroy()); if (cal){cal.destroy();cal=null;}
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v)); V[v](); scrollTo(0,0); }
function toggleSide(force){ const sd = $('#sidebar'), o = force ?? !sd.classList.contains('open'), m = innerWidth <= 860;
  sd.classList.toggle('open', o); $('#btn').className = 'bi ' + (o ? 'bi-x-lg' : 'bi-list'); $('#ovl').classList.toggle('on', o && m);
  if (!m) try { localStorage.setItem('povoa-side', o ? '1' : '0'); } catch(e) {} }
function gSearch(v){ window.GQ = v; go('tablero'); }
async function reload(){ await refresh(); go(view); }
 
/* ---------- helpers de UI ---------- */
const CH = [], ECOL = ['#8a97b3','#0A1F44','#FFC107','#000000','#5b86d6']; let mode = 'kanban';
const hi = () => { const h = new Date().getHours(); return h<12 ? 'Buenos días' : h<19 ? 'Buenas tardes' : 'Buenas noches'; };
const dateTxt = () => new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const head = (t,p,x='') => `<div class="top"><div><h2>${t}</h2><p>${p}</p></div><div>${x}</div></div>`;
const rbtn = `<button class="btn o sm" onclick="run(this,reload,'Datos actualizados')"><i class="bi bi-arrow-repeat"></i> Actualizar</button>`;
const hero = (t,p,b='') => `<div class="hero"><div><h2>${t}</h2><p>${p}</p></div>${b}</div>`;
const kpi = (i,l,v,s,c='') => `<div class="c3 kpi ${c}"><i class="bi ${i}"></i><b>${v}</b><span>${l}</span><small>${s}</small></div>`;
const card = (c,t,b,x='') => `<div class="${c} card"><div class="ch"><h3>${t}</h3>${x}</div>${b}</div>`;
const li = t => `<div class="li" onclick="openTask('${t.ID}')"><div><b>${esc(t.Titulo)}</b><small class="${late(t)?'late':''}">${esc(t.AreaSolicitante)} · ${fmt(t.FechaEntrega)}</small></div>${pill(t.Estado)}</div>`;
const list = (a,m) => a.length ? a.slice(0,6).map(li).join('') : `<div class="empty">${m}</div>`;
const cv = id => `<div class="cvw"><canvas id="${id}"></canvas></div>`;
const pill = e => `<span class="pill ${e==='En Revisión'?'y':e==='Rechazada'?'k':e==='Aprobada'?'w':''}">${e}</span>`;
function chart(id, type, labels, data, colors){
  const d = type==='doughnut'; Chart.defaults.color = dk() ? '#cdd7ee' : '#5d6b87'; Chart.defaults.borderColor = dk() ? '#23396a' : '#e0e5ee';
  CH.push(new Chart($(id), {type, data:{labels, datasets:[{data, backgroundColor:Array.isArray(colors)?colors.map(fix):fix(colors), borderRadius:6, borderWidth:0}]},
    options:{maintainAspectRatio:false, cutout:d?'68%':undefined, plugins:{legend:{display:d, position:'bottom', labels:{boxWidth:10, font:{family:'Montserrat',size:11}}}},
      scales:d?{}:{y:{beginAtZero:true,ticks:{precision:0}}, x:{grid:{display:false}}}}}));
}
const byEstado = T => ESTADOS.map(e => T.filter(t => t.Estado===e).length);
 
/* ---------- dashboards ---------- */
function dashAdmin(){
  const T = S.tareas, n = e => T.filter(t => t.Estado===e), rev = n('En Revisión'), sin = n('Pendiente'), atr = T.filter(late), ej = S.usuarios.filter(u => /ejecutivo/i.test(u.Rol)), ar = {};
  T.forEach(t => ar[t.AreaSolicitante] = (ar[t.AreaSolicitante]||0) + 1);
  $('#main').innerHTML = `<div class="g">` + hero(`${hi()}, ${esc(S.user.Nombres)}`, `${dateTxt()} · ${rev.length} entrega(s) por revisar y ${sin.length} solicitud(es) sin asignar`, `<button class="btn y" onclick="go('tablero')">Ir al tablero</button>`) +
   kpi('bi-inboxes-fill','Solicitudes',T.length,'en el sistema','dark') + kpi('bi-hourglass-split','Sin asignar',sin.length,'esperan prioridad') + kpi('bi-patch-check','Por revisar',rev.length,'entregas pendientes') + kpi('bi-exclamation-triangle','Atrasadas',atr.length,'pasaron su plazo') +
   card('c4','Estado de las tareas',cv('c1')) + card('c4','Carga por ejecutivo',cv('c2')) + card('c4','Solicitudes por área',cv('c3')) +
   card('c6','Cola de revisión',list(rev,'No hay entregas por revisar')) + card('c6','Por asignar',list(sin,'Todo está asignado')) + recent(T) + `</div>`;
  chart('#c1','doughnut',ESTADOS,byEstado(T),ECOL);
  chart('#c2','bar',ej.map(u=>u.Nombres), ej.map(u=>T.filter(t=>String(t.AsignadoA).toLowerCase()===String(u.Email).toLowerCase()&&t.Estado!=='Aprobada').length), '#0A1F44');
  chart('#c3','bar',Object.keys(ar),Object.values(ar),'#FFC107');
}
function dashEje(){
  const T = S.tareas, act = T.filter(t => t.Estado!=='Aprobada'), lim = new Date(Date.now()+7*864e5).toLocaleDateString('en-CA'),
    sem = act.filter(t => !late(t) && fmt(t.FechaEntrega) <= lim), atr = T.filter(late), cam = T.filter(t => t.Estado==='Rechazada'), rev = T.filter(t => t.Estado==='En Revisión');
  $('#main').innerHTML = `<div class="g">` + hero(`${hi()}, ${esc(S.user.Nombres)}`, `${dateTxt()} · tienes ${act.length} tarea(s) activa(s)${cam.length?` y ${cam.length} con cambios por hacer`:''}`, `<button class="btn y" onclick="go('tablero')">Ver mis tareas</button>`) +
   kpi('bi-lightning-charge-fill','Activas',act.length,'en tu lista','dark') + kpi('bi-calendar-week','Vencen en 7 días',sem.length,'planifica tu semana') + kpi('bi-arrow-repeat','Con cambios',cam.length,'pedidos por Dirección') + kpi('bi-exclamation-triangle','Atrasadas',atr.length,'requieren atención') +
   card('c8','Mi semana',list(atr.concat(sem),'Sin entregas próximas')) + card('c4','Mis tareas por estado',cv('c1')) +
   card('c6','Cambios solicitados',cam.length ? cam.map(t => `<div class="li fbk" onclick="openTask('${t.ID}')"><div><b>${esc(t.Titulo)}</b><small>${esc(t.FeedbackDirector)}</small></div></div>`).join('') : '<div class="empty">Sin cambios pendientes</div>') + card('c6','En revisión',list(rev,'Nada en revisión')) + recent(T) + `</div>`;
  chart('#c1','doughnut',ESTADOS,byEstado(T),ECOL);
}
function dashSol(){
  const T = S.tareas.slice().sort((a,b) => String(b.ID).localeCompare(String(a.ID))), n = e => T.filter(t => t.Estado===e).length;
  $('#main').innerHTML = `<div class="g">` + hero(`${hi()}, ${esc(S.user.Nombres)}`, `${dateTxt()} · sigue el avance de tus solicitudes`, `<button class="btn y" onclick="go('nueva')">Nueva solicitud</button>`) +
   kpi('bi-inboxes-fill','Solicitudes',T.length,'enviadas','dark') + kpi('bi-gear-wide-connected','En curso',n('En Progreso')+n('En Revisión')+n('Rechazada'),'en producción') + kpi('bi-hourglass-split','Pendientes',n('Pendiente'),'sin asignar') + kpi('bi-patch-check','Aprobadas',n('Aprobada'),'listas para usar') +
   card('c12','Solicitudes recientes',list(T,'Aún no has enviado solicitudes')) + `</div>`;
}
 
/* ---------- vistas ---------- */
const V = {
inicio(){ ({admin:dashAdmin, eje:dashEje, sol:dashSol})[role()](); },
tablero(){
  const r = role();
  $('#main').innerHTML = head(r==='sol'?'Mis solicitudes':r==='eje'?'Mis tareas':'Tablero de tareas','Clic en una tarjeta para ver el detalle', rbtn) +
  `<div class="filters"><input id="fq" placeholder="Buscar título o área…" oninput="drawBoard()"><select id="fp" onchange="drawBoard()"><option value="">Toda prioridad</option><option>Alta</option><option>Media</option><option>Baja</option><option>Por Asignar</option></select>
  ${r==='admin' ? `<select id="fe" onchange="drawBoard()"><option value="">Todos los responsables</option>${S.usuarios.filter(u=>/ejecutivo/i.test(u.Rol)).map(u=>`<option value="${esc(u.Email)}">${esc(u.Nombres)}</option>`).join('')}</select>` : ''}
  <div class="seg" style="margin-left:auto"><button id="m1" onclick="mode='kanban';drawBoard()">Tablero</button><button id="m2" onclick="mode='tabla';drawBoard()">Tabla</button></div></div><div id="board"></div>`;
  if (window.GQ) { $('#fq').value = window.GQ; window.GQ = ''; }
  drawBoard();
},
calendario(){
  $('#main').innerHTML = head('Calendario','Plazos de entrega de las tareas', rbtn) + '<div class="card"><div id="cal"></div></div>';
  const col = {Pendiente:'#5d6b87','En Progreso':'#0A1F44','En Revisión':'#FFC107',Rechazada:'#000','Aprobada':'#5b86d6'};
  cal = new FullCalendar.Calendar($('#cal'), {initialView:'dayGridMonth', locale:'es', firstDay:1, height:'auto', buttonText:{today:'Hoy'},
    events: S.tareas.filter(t => t.FechaEntrega).map(t => ({id:t.ID, title:t.Titulo, start:fmt(t.FechaEntrega), color:col[t.Estado]||'#0A1F44', textColor:t.Estado==='En Revisión'?'#000':'#fff'})).concat((S.reuniones||[]).map(m => ({id:'m'+m.ID, title:'📹 '+m.Titulo, start:m.Fecha+'T'+m.Hora, color:'#2a55b8'}))), eventClick: i => String(i.event.id).startsWith('m') ? openMeet(String(i.event.id).slice(1)) : openTask(i.event.id)});
  cal.render();
},
entregas(){
  $('#main').innerHTML = head('Entregas aprobadas','Trabajos finalizados y listos para usar', rbtn) + `<div class="filters"><input id="fq" placeholder="Buscar entregas…" oninput="drawEnt()"></div><div class="g" id="ent"></div>`; drawEnt();
},
equipo(){
  const ej = S.usuarios.filter(u => /ejecutivo/i.test(u.Rol));
  $('#main').innerHTML = head('Equipo de Marketing','Carga de trabajo de cada ejecutivo', rbtn) + `<div class="g">` + ej.map(u => {
    const M = S.tareas.filter(t => String(t.AsignadoA).toLowerCase()===String(u.Email).toLowerCase()), ok = M.filter(t => t.Estado==='Aprobada'), ac = M.filter(t => t.Estado!=='Aprobada'), p = M.length ? Math.round(ok.length/M.length*100) : 0;
    return card('c6', '', `<div class="mem">${photo(u)}<div><b>${esc(u.Nombres)} ${esc(u.Apellidos)}</b><br><small>${esc(u.Email)}</small></div></div>
      <div class="mst"><div><b>${ac.length}</b><small>Activas</small></div><div><b>${M.filter(t=>t.Estado==='En Revisión').length}</b><small>En revisión</small></div><div><b>${ok.length}</b><small>Aprobadas</small></div><div><b>${p}%</b><small>Completado</small></div></div>
      <div class="bar2"><i style="width:${p}%"></i></div>${list(ac,'Sin tareas activas')}`); }).join('') + `</div>`;
},
nueva(){
  const q = S.tareas.filter(t => t.Estado!=='Aprobada').length;
  $('#main').innerHTML = head('Nueva solicitud','Cuéntanos qué necesitas del equipo de Marketing') + `<div class="g">
  <form id="fNew" class="c8 card"><div class="grid2"><div><label>Área solicitante</label><input value="${esc(S.user.Departamento)}" disabled></div><div><label>Fecha de entrega deseada</label><input type="date" id="nF" min="${today()}" required></div></div>
  <label>Título de la solicitud</label><input id="nT" required maxlength="90" placeholder="Ej. Plan de captación de prospectos"><label>Descripción</label><textarea id="nD" rows="8" required placeholder="Objetivo, público, formato, medidas, referencias…"></textarea>
  <div class="act"><button class="btn y">Enviar solicitud</button><button type="reset" class="btn o">Limpiar</button></div></form>
  <div class="c4 card side-tip"><h3>Para una entrega más rápida</h3><ul><li>Explica el objetivo y a quién va dirigido.</li><li>Indica formato y medidas (post, video, flyer…).</li><li>Deja al menos 5 días hábiles para el plazo.</li><li>Puedes editar o cancelar la solicitud mientras esté Pendiente.</li></ul><p style="color:#b9c6e4;margin-bottom:0">Solicitudes activas en Marketing: <b style="color:var(--yellow)">${q}</b></p></div></div>`;
  $('#fNew').onsubmit = e => { e.preventDefault(); run(e.submitter, async () => { await api('createTask',{titulo:$('#nT').value,fechaEntrega:$('#nF').value,descripcion:$('#nD').value}); go('tablero'); }, 'Solicitud enviada'); };
},
usuarios(){
  $('#main').innerHTML = head('Usuarios','Administra accesos y roles del sistema', `<button class="btn y" onclick="userForm()"><i class="bi bi-person-plus-fill"></i> Nuevo usuario</button>`) +
  `<div class="card" style="overflow:auto"><table><thead><tr><th></th><th>Nombre</th><th>Correo</th><th>Departamento</th><th>Rol</th><th></th></tr></thead><tbody>${S.usuarios.map(u => `<tr style="cursor:default"><td>${photo(u)}</td><td><b>${esc(u.Nombres)} ${esc(u.Apellidos)}</b></td><td>${esc(u.Email)}</td><td>${esc(u.Departamento)}</td><td><span class="pill ${/director|admin/i.test(u.Rol)?'y':'w'}">${esc(u.Rol)}</span></td>
  <td style="white-space:nowrap"><button class="btn o sm" onclick="userForm('${u.ID}')">Editar</button> <button class="btn k sm" onclick="delUser('${u.ID}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`;
},
perfil(){
  const u = S.user, T = S.tareas, sol = role()==='sol';
  $('#main').innerHTML = head('Mi perfil','Administra tu información, foto y seguridad') + `<div class="g">
  <div class="c4 card prof"><div class="cover"></div><div class="pv" id="pv">${photo(u)}</div><h3>${esc(u.Nombres)} ${esc(u.Apellidos)}</h3><span class="pill y">${esc(u.Rol)}</span>
    <dl><dt>Correo</dt><dd>${esc(u.Email)}</dd><dt>Departamento</dt><dd>${esc(u.Departamento)}</dd></dl>

/* ---------- visor de archivos (Drive / Dropbox dentro de la app) ---------- */
function embedUrl(raw){
  let u; try { u = new URL(String(raw).trim()); } catch(e) { return null; }
  const h = u.hostname, id = (u.pathname + u.search).match(/(?:\/d\/|[?&]id=|\/folders\/)([-\w]{20,})/);
  if (h === 'drive.google.com' && id) return /\/folders\//.test(u.pathname) ? `https://drive.google.com/embeddedfolderview?id=${id[1]}#list` : `https://drive.google.com/file/d/${id[1]}/preview`;
  if (h === 'docs.google.com' && id) return `https://docs.google.com${u.pathname.replace(/\/(edit|view|pub).*$/,'')}/preview`.replace(/\/preview\/preview$/,'/preview');
  if (/(^|\.)dropbox\.com$/.test(h) && !/\/(fo|sh)\//.test(u.pathname)) { u.searchParams.delete('dl'); u.searchParams.set('raw','1'); return u.toString(); }
  return null;
}

  <div class="meta"><div><small>Fecha</small><b>${fmt(m.Fecha)}</b></div><div><small>Hora</small><b>${esc(m.Hora)} · ${m.Duracion} min</b></div><div><small>Organiza</small><b>${esc(nameOf(m.Creador))}</b></div><div><small>Participantes</small><b>${P.map(e => esc(nameOf(e))).join(', ') || '—'}</b></div></div>
  ${m.Descripcion ? `<div class="box">${esc(m.Descripcion)}</div>` : ''}
  <div class="foot2">${can ? `<button class="btn o sm" onclick="delMeet('${m.ID}')"><i class="bi bi-trash"></i> Cancelar reunión</button>` : ''}<button class="btn o" onclick="navigator.clipboard.writeText('${MEET}').then(()=>toast('Enlace copiado'))"><i class="bi bi-clipboard"></i> Copiar enlace</button><a class="btn y" href="${esc(mLink(m))}" target="_blank" rel="noopener"><i class="bi bi-camera-video-fill"></i> Unirse a Meet</a></div></div>`;
  show();
}
const delMeet = id => confirm('¿Cancelar esta reunión?') && run(null, async () => { await api('deleteMeeting',{id}); dlg.close(); go(view); toast('Reunión cancelada'); });
 
function openTask(id){
  const t = S.tareas.find(x => String(x.ID)===String(id)); if (!t) return;
  const r = role(), me = String(S.user.Email).toLowerCase(), mine = String(t.AsignadoA).toLowerCase()===me, own = String(t.EmailSolicitante).toLowerCase()===me;
  const ejes = S.usuarios.filter(u => /ejecutivo/i.test(u.Rol)), sec = (h,b) => `<div class="sec2"><h4>${h}</h4>${b}</div>`; let a = '';
  if (r==='admin') a += sec('Asignación', `<div class="frm"><div><label>Prioridad</label><select id="aP">${['Alta','Media','Baja'].map(x => `<option ${t.Prioridad===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>Responsable</label><select id="aE"><option value="">Sin asignar</option>${ejes.map(u => `<option value="${esc(u.Email)}" ${t.AsignadoA===u.Email?'selected':''}>${esc(u.Nombres)} ${esc(u.Apellidos)}</option>`).join('')}</select></div>
    <div><label>Fecha de entrega</label><input type="date" id="aF" value="${fmt(t.FechaEntrega)}"></div></div><div class="act"><button class="btn y sm" onclick="doAssign(this,'${t.ID}')">Guardar asignación</button></div>`);
  if ((r==='eje'&&mine || r==='admin') && ['En Progreso','Rechazada'].includes(t.Estado)) a += sec('Entregar trabajo', `<label>Enlace de Drive o Dropbox</label><div class="row2"><input id="aL" type="url" placeholder="https://" value="${esc(t.EnlaceEntrega)}"><button class="btn" onclick="doSubmit(this,'${t.ID}')">Enviar a revisión</button></div>`);
  if (r==='admin' && t.Estado==='En Revisión') a += sec('Revisión', `${fileBtn(t, 'Abrir entrega', 'o')}<label>Cambios requeridos (si rechazas)</label><textarea id="aB" rows="3" placeholder="Describe qué debe ajustarse…"></textarea>
    <div class="act"><button class="btn y" onclick="doReview(this,'${t.ID}',true)">Aprobar</button><button class="btn k" onclick="doReview(this,'${t.ID}',false)">Rechazar con cambios</button></div>`);
  const tools = [];
  if (r!=='sol') tools.push(`<button class="btn o sm" onclick="meetTask('${t.ID}')"><i class="bi bi-camera-video"></i> Reunión</button>`);
  if (r==='admin' || (own && t.Estado==='Pendiente')) tools.push(`<button class="btn o sm" onclick="editTask('${t.ID}')"><i class="bi bi-pencil"></i> Editar</button><button class="btn o sm" onclick="delTask('${t.ID}')"><i class="bi bi-trash"></i> ${r==='admin'?'Eliminar':'Cancelar solicitud'}</button>`);
  dlg.innerHTML = `<div class="mh"><div><div class="chips">${pill(t.Estado)}<span class="pill w">Prioridad: ${esc(t.Prioridad)}</span></div><h3>${esc(t.Titulo)}</h3></div><button class="x" onclick="dlg.close()" aria-label="Cerrar">✕</button></div><div class="mb">
  <div class="meta"><div><small>Área</small><b>${esc(t.AreaSolicitante)}</b></div><div><small>Solicitante</small><b>${esc(nameOf(t.EmailSolicitante))}</b></div><div><small>Responsable</small><b>${esc(nameOf(t.AsignadoA))}</b></div><div><small>Entrega</small><b class="${late(t)?'late':''}">${fmt(t.FechaEntrega)}</b></div></div>
  <div class="box">${esc(t.Descripcion)}</div>
  ${t.FeedbackDirector && t.Estado==='Rechazada' ? `<div class="box fb"><b>Cambios solicitados</b>${esc(t.FeedbackDirector)}</div>` : ''}
  ${t.EnlaceEntrega && (t.Estado==='Aprobada' || r!=='sol') ? fileBtn(t, 'Ver entrega') : ''}${a}${tools.length ? `<div class="foot2">${tools.join('')}</div>` : ''}</div>`;
  show();
}
 
function cacheAgenda(){ try { localStorage.setItem('povoa-agenda', JSON.stringify([...(S.reuniones||[]).map(m => ({t:m.Titulo,f:m.Fecha,h:m.Hora,m:1})), ...S.tareas.filter(t => t.Estado!=='Aprobada' && t.FechaEntrega).map(t => ({t:'Entrega: '+t.Titulo,f:fmt(t.FechaEntrega),h:''}))])); } catch(e) {} }
let LAG = [], LSEL = '';
function loginCards(){
  try { LAG = JSON.parse(localStorage.getItem('povoa-agenda') || '[]'); } catch(e) { LAG = []; }
  const iso = d => d.toLocaleDateString('en-CA'), n = new Date(), mon = new Date(n); mon.setDate(n.getDate() - (n.getDay()+6)%7);
  const days = [0,1,2,3,4].map(i => { const d = new Date(mon); d.setDate(mon.getDate()+i); return d; }); LSEL = LSEL || iso(n);
  $('#lcal').innerHTML = days.map((d,i) => `<span class="${iso(d)===LSEL?'on':''} ${LAG.some(e => e.f===iso(d))?'has':''}" onclick="LSEL='${iso(d)}';loginCards()" role="button">${'LMXJV'[i]}<small>${d.getDate()}</small></span>`).join('');
  const ev = LAG.filter(e => e.f===LSEL).sort((a,b) => (a.h||'99').localeCompare(b.h||'99'))[0], nx = LAG.filter(e => e.f > iso(n)).sort((a,b) => a.f.localeCompare(b.f))[0],
    lab = LSEL===iso(n) ? 'Hoy' : new Date(LSEL+'T00:00').toLocaleDateString('es',{weekday:'long',day:'numeric'});
  $('#lmeet').style.cursor = ev && ev.m ? 'pointer' : ''; $('#lmeet').onclick = ev && ev.m ? () => window.open(MEET, '_blank', 'noopener') : null;
  $('#lmeet').innerHTML = ev ? `${esc(ev.t)}<small>${lab} · ${ev.h || 'fecha de entrega'}</small>` : nx ? `Sin eventos ${lab==='Hoy'?'hoy':'ese día'}<small>Próximo: ${esc(nx.t)} · ${nx.f}</small>` : `Tu agenda aparecerá aquí<small>Ingresa para ver reuniones y entregas</small>`;
}
 
/* ---------- restaurar sesión ---------- */
document.addEventListener('DOMContentLoaded', async () => { setTheme(theme()); loginCards(); const s = sessionStorage.getItem('povoa'); if (!s) return; cred = JSON.parse(s);
  let c = null; try { c = JSON.parse(sessionStorage.getItem('povoa-data') || 'null'); } catch (e) {}
  if (c && c.user) { S = c; start(); }
  try { const prev = JSON.stringify(S); await refresh();
    if (!c) start(); else if (prev !== JSON.stringify(S)) { chrome(); if (!dlg.open && !['nueva','perfil'].includes(view)) go(view); }
  } catch (e) { if (/Credenciales/.test(e.message) || !c) { sessionStorage.removeItem('povoa'); sessionStorage.removeItem('povoa-data'); if (c) location.reload(); } }
});
</script>
